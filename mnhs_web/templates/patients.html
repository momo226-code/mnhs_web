{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Patients</h2>

<table class="table table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>Full Name</th>
        </tr>
    </thead>
    <tbody>
        {% for p in patients %}
        <tr>
            <td>{{ p.IID }}</td>
            <td>{{ p.FullName }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
